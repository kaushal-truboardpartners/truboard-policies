# Local dev stack: pgvector-enabled Postgres + FastAPI backend.
# Frontend runs separately via Vite (`cd frontend && npm run dev`) and is deployed separately.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: truboard
      POSTGRES_PASSWORD: truboard
      POSTGRES_DB: truboard_policies
    ports:
      - '5433:5432'  # 5433 on host to avoid conflict with existing Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U truboard -d truboard_policies']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Override DB host to the compose service name regardless of .env value.
      DATABASE_URL: postgresql+asyncpg://truboard:truboard@db:5432/truboard_policies
    ports:
      - '8000:8000'
    volumes:
      # Bind-mount source for hot reload; keep the container's own .venv.
      - ./backend:/app
      - /app/.venv
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy

  # DB admin UI. http://localhost:5050 — login admin@truboard.com / admin.
  # Add a server with host=db, port=5432, user=truboard, password=truboard.
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@truboard.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin:
